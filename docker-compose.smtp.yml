# Optional secret-file overlay. Supply a private path outside this repository.
services:
  backend:
    environment:
      EMAIL_SMTP_PASSWORD: ""
      EMAIL_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    secrets: [smtp_password]
  email-worker:
    environment:
      EMAIL_SMTP_PASSWORD: ""
      EMAIL_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    secrets: [smtp_password]

secrets:
  smtp_password:
    file: ${EMAIL_SMTP_SECRET_PATH:?Set the external SMTP secret file path}
