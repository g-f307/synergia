<main class="shell">
  <section class="card" aria-labelledby="page-title">
    <p class="eyebrow">Automação e Consolidação de Indicadores</p>
    <h1 id="page-title">{{ title }}</h1>
    <p>Estrutura inicial do frontend Angular integrada à API FastAPI.</p>

    @if (health$ | async; as health) {
      <p class="status status--ok">API disponível: {{ health.service }}</p>
    } @else {
      <p class="status status--offline">API indisponível em http://localhost:8000</p>
    }
  </section>
</main>
