<a class="skip-link" href="#main-content">Pular para o conteúdo</a>
@if (session.isAuthenticated()) {
  <div class="shell">
    <header class="topbar">
      <button class="menu-button" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-controls="main-navigation" aria-label="Abrir menu">☰</button>
      <a class="brand" routerLink="/profile" aria-label="SYNERGIA — início"><img src="/assets/logos/logo-horizontal.png" alt="SYNERGIA"></a>
      <div class="account"><span>{{ session.profile()?.display_name }}</span><button type="button" class="icon-button" (click)="toggleTheme()" aria-label="Alternar tema">◐</button><button type="button" class="link-button" (click)="logout()">Sair</button></div>
    </header>
    <aside class="sidebar" [class.open]="menuOpen()"><nav id="main-navigation" aria-label="Navegação principal">
      @for (item of visibleItems(); track item.route) { <a [routerLink]="item.route" routerLinkActive="active"><img [src]="'/assets/icons/' + item.icon" alt="" aria-hidden="true">{{ item.label }}</a> }
      <a routerLink="/profile" routerLinkActive="active"><img src="/assets/icons/settings.svg" alt="" aria-hidden="true">Perfil</a>
      @if (session.isAdministrator()) { <a routerLink="/admin" routerLinkActive="active"><img src="/assets/icons/shield.svg" alt="" aria-hidden="true">Administração</a> }
    </nav></aside>
    <main id="main-content" class="content" tabindex="-1"><syn-breadcrumbs /><router-outlet /></main>
  </div>
} @else { <main id="main-content" class="anonymous-shell"><router-outlet /></main> }
