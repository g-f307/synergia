groups:
  - name: synergia-ai-assistance
    rules:
      # Admission denials and suspended instances never enter this ratio.
      - alert: SynergiaAiAssistanceUnavailable
        expr: |
          (
            sum by(environment) (
              rate(synergia_ai_assistance_requests_total{result=~"unavailable|timeout"}[5m])
              and on(job,instance,environment) (synergia_ai_assistance_generation_enabled == 1)
            )
            /
            sum by(environment) (
              rate(synergia_ai_assistance_requests_total[5m])
              and on(job,instance,environment) (synergia_ai_assistance_generation_enabled == 1)
            )
          ) > 0.20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: AI assistance unavailability exceeds 20 percent for 10 minutes
          runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/ai-assistance-unavailable.md

      # Timestamp + lease age already encode the ten-minute wait: no extra for.
      # Database aggregates are replicated by API instances; never sum them.
      - alert: SynergiaAiAssistanceStalled
        expr: |
          (max by(environment) (
            synergia_ai_assistance_pending_reservations
            and on(job,instance,environment) (synergia_ai_assistance_collection_success == 1)
          ) > 0)
          and on(environment) (max by(environment) (
            synergia_ai_assistance_oldest_reservation_age_seconds
            and on(job,instance,environment) (synergia_ai_assistance_collection_success == 1)
          ) >= 600)
          and on(environment) (time() - max by(environment) (
            synergia_ai_assistance_last_completion_timestamp_seconds
            and on(job,instance,environment) (synergia_ai_assistance_collection_success == 1)
          ) >= 600)
          and on(environment) (max by(environment) (synergia_ai_assistance_generation_enabled) == 1)
        labels:
          severity: warning
        annotations:
          summary: AI assistance has old reservations and no conclusion for 10 minutes
          runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/ai-assistance-stalled.md

      - alert: SynergiaAiAssistanceIntegrityViolation
        expr: |
          (sum by(environment) (
            increase(synergia_ai_assistance_security_rejections_total{code=~"integrity_error|scope_violation"}[5m])
          ) > 0)
          or on(environment) (max by(environment) (
            increase(synergia_ai_assistance_persisted_integrity_errors_total[5m])
            and on(job,instance,environment) (synergia_ai_assistance_collection_success == 1)
          ) > 0)
          or on(environment) (sum by(environment) (
            increase(synergia_ai_assistance_generations_total{code="runtime_pin_mismatch"}[5m])
          ) > 0)
        labels:
          severity: critical
        annotations:
          summary: AI assistance detected an integrity or confirmed scope violation
          runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/ai-assistance-integrity.md

      - alert: SynergiaAiAssistanceExpiredReservationsGrowing
        expr: |
          max by(environment) (
            (delta(synergia_ai_assistance_expired_reservations[10m]) > 0)
            and (synergia_ai_assistance_expired_reservations > 0)
            and on(job,instance,environment) (synergia_ai_assistance_collection_success == 1)
          ) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Expired AI assistance reservations are growing
          runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/ai-assistance-reservations.md

      - alert: SynergiaAiAssistanceRetentionFailures
        expr: |
          max by(environment) (
            increase(synergia_ai_assistance_retention_runs_total{result="failed"}[15m])
            and on(job,instance,environment) (synergia_ai_assistance_collection_success == 1)
          ) >= 3
        labels:
          severity: warning
        annotations:
          summary: AI assistance retention failed repeatedly in 15 minutes
          runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/ai-assistance-retention.md

  - name: synergia-availability
    rules:
      - alert: SynergiaApiUnavailable
        expr: up{job="synergia-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: SYNERGIA API cannot be scraped by Prometheus
          runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/api-unavailable.md

      - alert: SynergiaCriticalDependencyUnavailable
        expr: synergia_dependency_up{component=~"configuration|postgresql|storage"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Required SYNERGIA dependency is unavailable
          runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/api-unavailable.md

      - alert: SynergiaEmailWorkerDegraded
        expr: synergia_dependency_degraded{component="email_worker"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Email delivery queue is degraded
          runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/report-notification-recovery.md

      - alert: SynergiaMetricsCollectionFailed
        expr: synergia_observability_collection_success{collector="postgresql"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Persistent operational metrics cannot be collected
          runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/database-unavailable.md

      - alert: SynergiaBackupMissingOrStale
        expr: |
          synergia_data_operation_last_success_timestamp_seconds{operation="backup"} == 0
          or time() - synergia_data_operation_last_success_timestamp_seconds{
            operation="backup"
          } > 90000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: No successful backup exists inside the proposed RPO tolerance
          runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/backup-restore.md

      - alert: SynergiaDataOperationFailuresDetected
        expr: |
          increase(synergia_data_operation_failures_total{
            operation=~"backup|verification|retention"
          }[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: A persisted backup, verification or retention operation failed
          runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/backup-restore.md

  - name: synergia-critical-journeys
    rules:
      - alert: SynergiaHttpErrorRateHigh
        expr: |
          sum(rate(synergia_http_requests_total{status_class="5xx"}[5m]))
          / clamp_min(sum(rate(synergia_http_requests_total[5m])), 0.01) > 0.05
          and sum(rate(synergia_http_requests_total[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: API 5xx error ratio is above the preliminary threshold
          runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/api-unavailable.md

      - alert: SynergiaExecutionFailuresDetected
        expr: |
          increase(synergia_operational_events_total{
            journey="execution",outcome=~"failed|validation_failed"
          }[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Execution or validation failures were detected
          runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/processing-interrupted.md

      - alert: SynergiaImportRejectionRateHigh
        expr: |
          sum(increase(synergia_operational_events_total{
            journey="inspection",outcome="rejected"
          }[10m]))
          / clamp_min(sum(increase(synergia_operational_events_total{
            journey="inspection"
          }[10m])), 1) > 0.20
          and sum(increase(synergia_operational_events_total{
            journey="inspection"
          }[10m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Import rejection ratio is above the preliminary threshold
          runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/invalid-file.md

      - alert: SynergiaReportFailuresDetected
        expr: |
          increase(synergia_operational_events_total{
            journey="report",outcome="generation_failed"
          }[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Report generation failures were detected
          runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/report-notification-recovery.md

      - alert: SynergiaNotificationFailuresDetected
        expr: |
          increase(synergia_operational_events_total{
            journey="notification",outcome="delivery_failed"
          }[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Internal notification delivery failures were detected
          runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/report-notification-recovery.md

      - alert: SynergiaEmailFailuresDetected
        expr: |
          increase(synergia_operational_events_total{
            journey="email",outcome="failed"
          }[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Email delivery exhausted its retry policy
          runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/report-notification-recovery.md

      - alert: SynergiaQueueStalled
        expr: |
          synergia_queue_oldest_age_seconds{queue=~"execution|report|email"} > 300
          and on(queue) sum by(queue) (synergia_queue_depth) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: An operational queue is not progressing
          runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/processing-interrupted.md

      - alert: SynergiaIngestionMemoryBudgetExceeded
        expr: |
          synergia_ingestion_memory_budget_bytes > 0
          and synergia_ingestion_estimated_memory_bytes
            > synergia_ingestion_memory_budget_bytes
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Ingestion exceeded its configured memory budget
          runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/ingestion-memory-budget.md

      - alert: SynergiaApprovalBacklogOld
        expr: |
          synergia_queue_oldest_age_seconds{queue="approval"} > 86400
          and on(queue) sum by(queue) (synergia_queue_depth) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Human approval backlog contains old requests
          runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/approval-backlog.md

      - alert: SynergiaRateLimitDenialsHigh
        expr: sum(increase(synergia_rate_limit_denials_total[5m])) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Rate-limit denials are above the preliminary threshold
          runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/abuse-response.md
