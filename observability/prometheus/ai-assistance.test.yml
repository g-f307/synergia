# Synthetic series only. No external services, credentials or inference.
rule_files:
- alerts.yml
evaluation_interval: 1m
tests:
- name: 'availability: waits full 10m then recovers on healthy traffic'
  interval: 1m
  input_series:
  - series: synergia_ai_assistance_requests_total{job="synergia-api",instance="a",environment="test",result="unavailable"}
    values: 0+3x12 36x18
  - series: synergia_ai_assistance_requests_total{job="synergia-api",instance="a",environment="test",result="generated"}
    values: 0+7x30
  - series: synergia_ai_assistance_generation_enabled{job="synergia-api",instance="a",environment="test"}
    values: 1x30
  alert_rule_test:
  - eval_time: 10m
    alertname: SynergiaAiAssistanceUnavailable
    exp_alerts: []
  - eval_time: 11m
    alertname: SynergiaAiAssistanceUnavailable
    exp_alerts:
    - exp_labels:
        environment: test
        severity: warning
      exp_annotations:
        summary: AI assistance unavailability exceeds 20 percent for 10 minutes
        runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/ai-assistance-unavailable.md
  - eval_time: 12m
    alertname: SynergiaAiAssistanceUnavailable
    exp_alerts:
    - exp_labels:
        environment: test
        severity: warning
      exp_annotations:
        summary: AI assistance unavailability exceeds 20 percent for 10 minutes
        runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/ai-assistance-unavailable.md
  - eval_time: 16m
    alertname: SynergiaAiAssistanceUnavailable
    exp_alerts: []
- name: 'availability: timeout also contributes, denials never dilute the ratio'
  interval: 1m
  input_series:
  - series: synergia_ai_assistance_requests_total{job="synergia-api",instance="a",environment="test",result="unavailable"}
    values: 0+1x30
  - series: synergia_ai_assistance_requests_total{job="synergia-api",instance="a",environment="test",result="generated"}
    values: 0+7x30
  - series: synergia_ai_assistance_generation_enabled{job="synergia-api",instance="a",environment="test"}
    values: 1x30
  - series: synergia_ai_assistance_requests_total{job="synergia-api",instance="a",environment="test",result="timeout"}
    values: 0+2x30
  - series: synergia_ai_assistance_request_denials_total{job="synergia-api",instance="a",environment="test",code="rate_limit_exceeded"}
    values: 0+10000x30
  alert_rule_test:
  - eval_time: 11m
    alertname: SynergiaAiAssistanceUnavailable
    exp_alerts:
    - exp_labels:
        environment: test
        severity: warning
      exp_annotations:
        summary: AI assistance unavailability exceeds 20 percent for 10 minutes
        runbook: https://github.com/g-f307/synergia/blob/main/docs/runbooks/ai-assistance-unavailable.md
- name: 'availability: exactly 20 percent is not above threshold'
  interval: 1m
  input_series:
  - series: synergia_ai_assistance_requests_total{job="synergia-api",instance="a",environment="test",result="unavailable"}
    values: 0+2x30
  - series: synergia_ai_assistance_requests_total{job="synergia-api",instance="a",environment="test",result="generated"}
    values: 0+8x30
  - series: synergia_ai_assistance_generation_enabled{job="synergia-api",instance="a",environment="test"}
    values: 1x30
  alert_rule_test:
  - eval_time: 20m
    alertname: SynergiaAiAssistanceUnavailable
    exp_alerts: []
- name: 'availability: no traffic has no ratio'
  interval: 1m
  input_series:
  - series: synergia_ai_assistance_requests_total{job="synergia-api",instance="a",environment="test",result="unavailable"}
    values: '0x30'
  - series: synergia_ai_assistance_requests_total{job="synergia-api",instance="a",environment="test",result="generated"}
    values: '0x30'
  - series: synergia_ai_assistance_generation_enabled{job="synergia-api",instance="a",environment="test"}
    values: 1x30
  alert_rule_test:
  - eval_time: 20m
    alertname: SynergiaAiAssistanceUnavailable
    exp_alerts: []
- name: 'availability: disabling generation clears an existing alert'
  interval: 1m
