global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: synergia-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/synergia_metrics_token
    static_configs:
      - targets:
          - host.docker.internal:8000
