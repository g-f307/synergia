name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Angular — lint, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json
      - run: npm ci
      - name: Executar lint
        run: npm run lint
      - name: Executar testes com cobertura
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test -- --watch=false --browsers=ChromeHeadless --code-coverage
      - name: Gerar build
        run: npm run build
      - name: Publicar cobertura Angular
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-angular
          path: frontend-angular/coverage/
          if-no-files-found: error

  backend:
    name: FastAPI — lint, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Executar lint
        run: ruff check .
      - name: Executar testes
        run: pytest -q -m "not integration" --junitxml=reports/pytest.xml
      - name: Validar matriz e executar regressão de segurança
        run: |
          python ../scripts/security_matrix.py --check
          pytest -q -m "security and not integration" --junitxml=reports/security.xml
      - name: Validar build Python
        run: python -m compileall -q app
      - name: Publicar relatório FastAPI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-fastapi
          path: backend/reports/pytest.xml
          if-no-files-found: error
      - name: Publicar relatório de segurança
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seguranca-fastapi
          path: |
            backend/reports/security.xml
            docs/security-test-report.md
          if-no-files-found: error

  project-data:
    name: Banco e dados sintéticos
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: synergia_ci
          POSTGRES_USER: synergia
          POSTGRES_PASSWORD: synergia-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synergia -d synergia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: synergia_ci
      PGUSER: synergia
      PGPASSWORD: synergia-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependências de persistência
        run: pip install -r backend/requirements-dev.txt
      - name: Confirmar disponibilidade do PostgreSQL
        run: pg_isready
      - name: Validar migrations e dados sintéticos
        run: python scripts/validate_project_assets.py
      - name: Executar testes de persistência
        env:
          DATABASE_URL: postgresql://synergia:synergia-ci-only@localhost:5432/synergia_ci
        run: pytest -q -m integration backend/tests --junitxml=backend/reports/integration.xml
      - name: Publicar relatório de segurança PostgreSQL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seguranca-postgresql
          path: backend/reports/integration.xml
          if-no-files-found: error
      - name: Validar Docker Compose
        run: docker compose config

  prototype:
    name: Preservar protótipo publicado
    runs-on: ubuntu-latest
    steps:
      - name: Obter protótipo sem modificar a branch
        uses: actions/checkout@v4
        with:
          ref: prototype-pages
      - name: Confirmar arquivos do protótipo
        run: test -f index.html && test -f styles.css && test -f script.js
