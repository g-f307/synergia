name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Angular — lint, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Executar lint
        run: npm run lint
      - name: Validar ativos visuais incorporados
        run: python ../scripts/validate_web_assets.py
      - name: Validar fidelidade da fundação visual
        run: python ../scripts/validate_visual_system.py
      - name: Validar catálogos de internacionalização
        run: python ../scripts/validate_i18n.py
      - name: Executar testes com cobertura
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test -- --watch=false --browsers=ChromeHeadless --code-coverage
      - name: Gerar build
        run: npm run build
      - name: Validar imagem e configuraÃ§Ã£o runtime do frontend
        shell: bash
        run: |
          set -euo pipefail
          image="synergia-web-security-test:${GITHUB_SHA}"
          container="synergia-web-security-${GITHUB_RUN_ID}"
          api_origin="https://api.production.example.invalid"
          docker build -t "$image" -f Dockerfile .
          docker run -d --name "$container" -p 127.0.0.1:18080:8080 \
            -e SYNERGIA_API_ORIGIN="$api_origin" "$image"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/login >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          runtime_config="$(curl --fail --silent http://127.0.0.1:18080/runtime-config.js)"
          headers="$(curl --fail --silent --dump-header - --output /dev/null http://127.0.0.1:18080/login | tr -d '\r')"
          test "$(docker inspect --format '{{.Config.User}}' "$container")" = nginx
          grep -F "apiUrl: '$api_origin'" <<<"$runtime_config"
          grep -Fi "content-security-policy:" <<<"$headers" | grep -F "connect-src 'self' $api_origin"
      - name: Publicar cobertura Angular
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-angular
          path: web/coverage/
          if-no-files-found: error

  backend:
    name: FastAPI — lint, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Executar lint
        run: ruff check . ../scripts
      - name: Executar testes
        run: pytest -q -m "not integration" --junitxml=reports/pytest.xml
      - name: Validar matriz e executar regressão de segurança
        run: |
          python ../scripts/validate_access_matrix.py
          python ../scripts/validate_web_journey_map.py
          python ../scripts/validate_threat_model.py
          python ../scripts/validate_http_security.py
          python ../scripts/security_matrix.py --check
          pytest -q -m "security and not integration" --junitxml=reports/security.xml
      - name: Validar build Python
        run: python -m compileall -q app
      - name: Publicar relatório FastAPI
        if: always() && hashFiles('backend/reports/pytest.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: testes-fastapi
          path: backend/reports/pytest.xml
          if-no-files-found: error
      - name: Publicar relatório de segurança
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seguranca-fastapi
          path: |
            backend/reports/security.xml
            docs/security-test-report.md
          if-no-files-found: error

  project-data:
    name: Banco e dados sintéticos
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: synergia_ci
          POSTGRES_USER: synergia
          POSTGRES_PASSWORD: synergia-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synergia -d synergia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: synergia_ci
      PGUSER: synergia
      PGPASSWORD: synergia-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependências de persistência
        run: pip install -r backend/requirements-dev.txt
      - name: Confirmar disponibilidade do PostgreSQL
        run: pg_isready
      - name: Validar migrations e dados sintéticos
        run: python scripts/validate_project_assets.py
      - name: Executar testes de persistência
        env:
          DATABASE_URL: postgresql://synergia:synergia-ci-only@localhost:5432/synergia_ci
        run: pytest -q -m integration backend/tests --junitxml=backend/reports/integration.xml
      - name: Preparar banco isolado do fluxo web
        run: |
          createdb synergia_e2e
          PGDATABASE=synergia_e2e python scripts/validate_project_assets.py
          DATABASE_URL=postgresql://synergia:synergia-ci-only@localhost:5432/synergia_e2e python scripts/bootstrap_web_e2e.py
      - name: Instalar dependências do E2E
        working-directory: web
        run: npm ci
      - name: Validar fluxo web ponta a ponta
        id: e2e
        working-directory: web
        env:
          DATABASE_URL: postgresql://synergia:synergia-ci-only@localhost:5432/synergia_e2e
          E2E_API_COMMAND: python -m uvicorn app.main:app --host 127.0.0.1 --port 8000
          E2E_BROWSER_CHANNEL: chrome
          E2E_RECORD_VIDEO: "false"
          E2E_PYTHON: python
        run: npm run e2e
      - name: Publicar relatório de segurança PostgreSQL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seguranca-postgresql
          path: backend/reports/integration.xml
          if-no-files-found: error
      - name: Publicar evidências do fluxo web
        if: always() && steps.e2e.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: fluxo-web-e2e
          path: |
            web/reports/e2e-html/
            web/reports/e2e-results/
          if-no-files-found: error
      - name: Validar Docker Compose
        run: docker compose config

  prototype:
    name: Preservar protótipo publicado
    runs-on: ubuntu-latest
    steps:
      - name: Obter protótipo sem modificar a branch
        uses: actions/checkout@v4
        with:
          ref: prototype-pages
      - name: Confirmar arquivos do protótipo
        run: test -f index.html && test -f styles.css && test -f script.js

  security-release:
    name: Segurança ofensiva e cadeia de dependências
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: synergia_security
          POSTGRES_USER: synergia
          POSTGRES_PASSWORD: synergia-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synergia -d synergia_security"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://synergia:synergia-ci-only@localhost:5432/synergia_security
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: synergia_security
      PGUSER: synergia
      PGPASSWORD: synergia-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar ferramentas com versões registradas
        run: |
          pip install -r backend/requirements-dev.txt pip-audit==2.10.0
          npm ci --prefix web
          python --version
          pip-audit --version
          npm --version
          psql --version
          psql --tuples-only --no-align --command "SELECT version();"
      - name: Validar política, detectores de segredo e SBOM
        id: policy
        continue-on-error: true
        run: |
          mkdir -p reports/private
          python scripts/security_release.py validate
          pytest -q -p no:cacheprovider -m "security and not integration" backend/tests \
            --junitxml=reports/security/offensive-tests.xml
      - name: Auditar dependências Python
        id: python_audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pip-audit -r backend/requirements-dev.txt --format=json \
            --output=reports/private/python-audit-raw.json
          set -e
          python scripts/security_release.py audit --ecosystem python \
            --input reports/private/python-audit-raw.json
      - name: Auditar dependências Node
        id: node_audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm audit --prefix web --omit=dev --json > reports/private/node-audit-raw.json
          set -e
          python scripts/security_release.py audit --ecosystem node \
            --input reports/private/node-audit-raw.json
      - name: Preparar API descartável para DAST
        env:
          RATE_LIMIT_ENABLED: "false"
          SYNERGIA_ENV: test
          SYNERGIA_LOCAL_AUTH_ENABLED: "true"
          AUTH_JWT_ISSUER: synergia-security-ci
          AUTH_JWT_AUDIENCE: synergia-security-dast
          AUTH_REFRESH_COOKIE_SECURE: "false"
        shell: bash
        run: |
          set -euo pipefail
          export AUTH_JWT_SIGNING_KEY="synthetic-${GITHUB_RUN_ID}-${GITHUB_SHA}"
          python scripts/validate_project_assets.py
          python scripts/bootstrap_web_e2e.py
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 18000 \
            > ../reports/security/dast-api.log 2>&1 &
          echo $! > ../reports/security/dast-api.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:18000/health >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Executar DAST controlado
        id: dast
        continue-on-error: true
        env:
          DAST_EMAIL: operator.e2e@example.invalid
          DAST_PASSWORD: synthetic-e2e-password-63
        run: python scripts/security_release.py dast --target http://127.0.0.1:18000
      - name: Encerrar API descartável
        if: always()
        shell: bash
        run: test ! -f reports/security/dast-api.pid || kill "$(cat reports/security/dast-api.pid)" || true
      - name: Construir imagem do frontend
        run: docker build -t synergia-web-security:${GITHUB_SHA} web
      - name: Auditar filesystem, configuração e segredos com Trivy
        id: trivy_fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: reports/private/trivy-filesystem.json
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
      - name: Aplicar política ao relatório Trivy de filesystem
        id: trivy_fs_policy
        if: always()
        continue-on-error: true
        run: >-
          python scripts/security_release.py audit
          --ecosystem trivy-filesystem
          --input reports/private/trivy-filesystem.json
      - name: Auditar imagem publicada com Trivy
        id: trivy_image
        continue-on-error: true
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: synergia-web-security:${{ github.sha }}
          format: json
          output: reports/private/trivy-image.json
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
      - name: Aplicar política ao relatório Trivy da imagem
        id: trivy_image_policy
        if: always()
        continue-on-error: true
        run: >-
          python scripts/security_release.py audit
          --ecosystem trivy-image
          --input reports/private/trivy-image.json
      - name: Gerar SBOM da imagem publicada
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: synergia-web-security:${{ github.sha }}
          format: cyclonedx
          output: reports/security/web-image-sbom.cdx.json
          scan-type: image
      - name: Aplicar decisão final do portão
        if: always()
        env:
          POLICY: ${{ steps.policy.outcome }}
          PYTHON_AUDIT: ${{ steps.python_audit.outcome }}
          NODE_AUDIT: ${{ steps.node_audit.outcome }}
          DAST: ${{ steps.dast.outcome }}
          TRIVY_FS: ${{ steps.trivy_fs.outcome }}
          TRIVY_FS_POLICY: ${{ steps.trivy_fs_policy.outcome }}
          TRIVY_IMAGE: ${{ steps.trivy_image.outcome }}
          TRIVY_IMAGE_POLICY: ${{ steps.trivy_image_policy.outcome }}
        shell: bash
        run: |
          failed=0
          for check in POLICY PYTHON_AUDIT NODE_AUDIT DAST TRIVY_FS \
            TRIVY_FS_POLICY TRIVY_IMAGE TRIVY_IMAGE_POLICY; do
            outcome="${!check}"
            if [ "$outcome" != success ]; then
              echo "::error title=Security gate failed::$check finished with $outcome"
              failed=1
            fi
          done
          exit "$failed"
      - name: Publicar evidências sanitizadas de segurança
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seguranca-ofensiva-e-supply-chain
          path: |
            reports/security/*.json
            reports/security/*.xml
          if-no-files-found: error
          retention-days: 14
