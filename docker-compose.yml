name: synergia

x-backend-environment: &backend-environment
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: ${POSTGRES_DB:-synergia}
  PGUSER: ${POSTGRES_USER:-synergia}
  PGPASSWORD: ${POSTGRES_PASSWORD:-synergia-local-only}
  IMPORT_STORAGE_DIR: /var/lib/synergia/imports
  INGESTION_ALLOWED_SHEETS: ${INGESTION_ALLOWED_SHEETS:-}
  PROFILE_AVATAR_STORAGE_ROOT: /var/lib/synergia/avatars
  EMAIL_CAPTURE_PATH: /var/lib/synergia/email-capture/messages.jsonl
  SYNERGIA_ENV: ${SYNERGIA_ENV:-development}
  SYNERGIA_LOCAL_AUTH_ENABLED: ${SYNERGIA_LOCAL_AUTH_ENABLED:-false}
  AUTH_JWT_ALGORITHM: ${AUTH_JWT_ALGORITHM:-HS256}
  AUTH_JWT_SIGNING_KEY: ${AUTH_JWT_SIGNING_KEY:-synergia-local-signing-key-change-me-119}
  AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-synergia-local}
  AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-synergia-api}
  AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-false}
  AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:8080}
  RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET:-synergia-local-rate-limit-key-change-me}
  OBSERVABILITY_LOG_LEVEL: ${OBSERVABILITY_LOG_LEVEL:-INFO}
  MIGRATION_BASELINE_THROUGH: ${MIGRATION_BASELINE_THROUGH:-}

x-email-environment: &email-environment
  EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-false}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-disabled}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
  EMAIL_BATCH_SIZE: ${EMAIL_BATCH_SIZE:-50}
  EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-3}
  EMAIL_RETRY_SECONDS: ${EMAIL_RETRY_SECONDS:-60}
  EMAIL_CONSOLIDATION_SECONDS: ${EMAIL_CONSOLIDATION_SECONDS:-60}
  EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
  EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
  EMAIL_SMTP_TLS_MODE: ${EMAIL_SMTP_TLS_MODE:-starttls}
  EMAIL_SMTP_TIMEOUT_SECONDS: ${EMAIL_SMTP_TIMEOUT_SECONDS:-15}
  EMAIL_SMTP_AUTH_MODE: ${EMAIL_SMTP_AUTH_MODE:-password}
  EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
  EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
  EMAIL_SMTP_PASSWORD_FILE: ${EMAIL_SMTP_PASSWORD_FILE:-}
  EMAIL_SMTP_ALLOWED_RECIPIENTS: ${EMAIL_SMTP_ALLOWED_RECIPIENTS:-}

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synergia}
      POSTGRES_USER: ${POSTGRES_USER:-synergia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synergia-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - synergia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  migrate:
    image: synergia-backend:${SYNERGIA_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "scripts/apply_migrations.py"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: synergia-backend:${SYNERGIA_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: [*backend-environment, *email-environment]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - synergia-application-data:/var/lib/synergia
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  email-worker:
    profiles: [email]
    image: synergia-backend:${SYNERGIA_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "scripts/process_email_notifications.py"]
    environment:
      <<: [*backend-environment, *email-environment]
    volumes:
      - synergia-application-data:/var/lib/synergia
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  web:
    image: synergia-web:${SYNERGIA_IMAGE_TAG:-local}
    build:
      context: web
      dockerfile: Dockerfile
    environment:
      SYNERGIA_API_ORIGIN: ${SYNERGIA_API_ORIGIN:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  synergia-postgres:
  synergia-application-data:
